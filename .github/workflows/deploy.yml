# Envoie une version de l'intégration à Zapier (`zapier-platform push` : version PRIVÉE, à partager par lien
# d'invitation). La rendre publique est une revue de Zapier, à demander à la main (`promote`, README).
#
# Déclencheur : l'étiquette Git `vX.Y.Z` (la version de package.json DOIT être celle de l'étiquette), ou « Run
# workflow » à la main, qui n'envoie JAMAIS sauf si on décoche `dry_run` sur une étiquette.
#
# Prérequis, UNE fois : `.zapierapprc` committé (`zapier-platform register "Duva"`) et le secret
# `ZAPIER_DEPLOY_KEY` (clé de déploiement du compte propriétaire de l'intégration).
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Contrôler seulement (ne rien envoyer à Zapier)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La version de package.json est celle de l'étiquette
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "package.json=${version}, étiquette=${GITHUB_REF_NAME}" >&2; exit 1; }
      - name: Le CHANGELOG annonce la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^## ${GITHUB_REF_NAME#v}\$" CHANGELOG.md || { echo "CHANGELOG sans section ${GITHUB_REF_NAME#v}" >&2; exit 1; }
      - run: npm test
      - run: npm run validate

  push:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: L'intégration est enregistrée (.zapierapprc) et la clé de déploiement existe
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          [ -f .zapierapprc ] || { echo ".zapierapprc absent : lancer « zapier-platform register Duva » et le committer (README)" >&2; exit 1; }
          [ -n "${ZAPIER_DEPLOY_KEY}" ] || { echo "secret ZAPIER_DEPLOY_KEY absent (README)" >&2; exit 1; }
      - run: npx zapier-platform push
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
